<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Premium Calculator | My First Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- H1 TEXT: my first project calculator (top center) -->
    <div class="project-title">
        <h1>✨ my first project <span class="highlight">calculator</span> ✨</h1>
        <div class="tagline">next calculator • glass premium</div>
    </div>

    <!-- CALCULATOR BOX -->
    <div class="calculator">
        <div class="history-panel">
            <span id="historyExpr">✨ Getready </span>
        </div>
        <div class="display-wrapper">
            <input type="text" id="display" readonly placeholder="0">
        </div>
        <div class="buttons-grid">
            <!-- row 1 -->
            <button class="btn btn-function" data-value="CE">CE</button>
            <button class="btn btn-function" data-value="DEL">⌫</button>
            <button class="btn btn-operator" data-value="%">%</button>
            <button class="btn btn-operator" data-value="/">÷</button>

            <!-- row 2 -->
            <button class="btn btn-number" data-value="7">7</button>
            <button class="btn btn-number" data-value="8">8</button>
            <button class="btn btn-number" data-value="9">9</button>
            <button class="btn btn-operator" data-value="*">×</button>

            <!-- row 3 -->
            <button class="btn btn-number" data-value="4">4</button>
            <button class="btn btn-number" data-value="5">5</button>
            <button class="btn btn-number" data-value="6">6</button>
            <button class="btn btn-operator" data-value="-">−</button>

            <!-- row 4 -->
            <button class="btn btn-number" data-value="1">1</button>
            <button class="btn btn-number" data-value="2">2</button>
            <button class="btn btn-number" data-value="3">3</button>
            <button class="btn btn-operator" data-value="+">+</button>

            <!-- row 5 -->
            <button class="btn btn-number zero-btn" data-value="0">0</button>
            <button class="btn btn-number" data-value=".">.</button>
            <button class="btn btn-equal" data-value="=">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
